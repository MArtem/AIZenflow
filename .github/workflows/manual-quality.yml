name: Manual Quality Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Repository static gate
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned quality engine
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: MArtem/AIZenflowQualityControl
          ref: cb81e49662d90c06c8618747bc7f8a760d79fae6
          path: .quality-engine
          fetch-depth: 1
          persist-credentials: false
      - name: Run tracked-secret check
        shell: bash
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.SECRETS.TRACKED \
            > "${RUNNER_TEMP}/tchop-secrets.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "tchop-secrets.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Tracked-secret check did not report PASS")
          PY
      - name: Run TODO ownership check
        shell: bash
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.TODO.OWNER \
            > "${RUNNER_TEMP}/tchop-todo.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "tchop-todo.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("TODO ownership check did not report PASS")
          PY
      - name: Run generated ownership check
        shell: bash
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.GENERATED.OWNERSHIP \
            > "${RUNNER_TEMP}/tchop-generated-ownership.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "tchop-generated-ownership.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Generated ownership check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.GENERATED.OWNERSHIP":
              raise SystemExit("Unexpected generated ownership check ID")
          PY
      - name: Run dependency lock drift check
        shell: bash
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.DEPENDENCY.LOCK_DRIFT \
            > "${RUNNER_TEMP}/tchop-dependency-lock-drift.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "tchop-dependency-lock-drift.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Dependency lock drift check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.DEPENDENCY.LOCK_DRIFT":
              raise SystemExit("Unexpected dependency lock drift check ID")
          PY
      - name: Run localization catalog check
        shell: bash
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.LOCALIZATION.CATALOG \
            > "${RUNNER_TEMP}/tchop-localization-catalog.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "tchop-localization-catalog.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Localization catalog check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.LOCALIZATION.CATALOG":
              raise SystemExit("Unexpected localization catalog check ID")
          PY
      - name: Run resources assets check
        shell: bash
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.RESOURCES.ASSETS \
            > "${RUNNER_TEMP}/tchop-resources-assets.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "tchop-resources-assets.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Resources assets check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.RESOURCES.ASSETS":
              raise SystemExit("Unexpected resources assets check ID")
          PY
      - name: Run privacy manifest check
        shell: bash
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.PRIVACY.MANIFEST \
            > "${RUNNER_TEMP}/aizenflow-privacy-manifest.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "aizenflow-privacy-manifest.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Privacy manifest check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.PRIVACY.MANIFEST":
              raise SystemExit("Unexpected privacy manifest check ID")
          PY
      - name: Run pinned scoped static check (Xcode membership not asserted)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .quality-control-cache/cache
          swift run \
            --package-path "${GITHUB_WORKSPACE}/.quality-engine" \
            --scratch-path "${RUNNER_TEMP}/quality-engine-scratch" \
            -Xswiftc -warnings-as-errors \
            quality static \
            --profile "${GITHUB_WORKSPACE}/.quality-control/profile.json" \
            --policy "${GITHUB_WORKSPACE}/.quality-engine/policies/static-policy.json" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --scope explicit-source-paths \
            > "${RUNNER_TEMP}/tchop-quality.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "tchop-quality.json"), encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Policy-driven static check did not report PASS")
          PY
